description: "Digitale gemeenschapsgoederen en open source werken in de publieke sector: van concept naar werkende software naar draaiende dienst."
about: "Studeerde natural computing, het modelleren van complexe systemen. Na een paar jaar software development bij een webbureau en twee succesvolle social media startups, sinds 2015 gefocust op opensourcewerken en mensgerichte digitalisering in de publieke sector.<br><br>Adviseur publieke software en community ontwikkeling; van digitaal bonnenboekje voor de straatmarkten van Amsterdam tot Algoritmeregister van de Nederlandse Overheid, van publieke tribune voor CoronaApps tot codeplatform voor de Overheid."
