<style>
    /* De laptop is een illustratie met een eigen palet: alleen hier */
    .computer {
        --laptop: #B5A878;
        --laptop-light: #DAD7B8;
        --laptop-mid: #9D9266;
        --laptop-warm: #9D8759;
        --laptop-dark: #736936;
        --laptop-sticker-bg: rgba(181, 168, 120, .25);
        width: 310px;
        background: var(--laptop);
        border-top: 10px solid var(--laptop-light);
        border-right: 4px solid var(--laptop-mid);
        border-left: 4px solid var(--laptop-warm);
        border-bottom: 10px solid var(--laptop-dark);
        margin: auto;
        position: relative;
    }
    .easter-egg {
        position: relative;
        background: center center no-repeat;
        background-size: cover;
        width: 100%;
        display: none;
        padding: 10px 0;
    }
    .computer-blur {
        position: absolute;
        width: 100%;
        height: 100%;
        backdrop-filter: blur(10px);
        background: rgba(0, 0, 0, .5);
        top: 0;
        left: 0;
    }
    .computer .screen {
        width: 280px;
        height: 210px;
        background: #000000;
        margin-top: 10px;
        margin-left: 10px;
        margin-right: 10px;
        margin-bottom: 10px;
        border-bottom: 4px solid var(--laptop-light);
        border-left: 4px solid var(--laptop-mid);
        border-right: 4px solid var(--laptop-warm);
        border-top: 4px solid var(--laptop-dark);
    }
    .computer .bottom {
        position: relative;
    }
    .computer .drive {
        width: 100px;
        height: 4px;
        margin-left: 140px;
        background: #000000;
        margin-bottom: 40px;
        border-bottom: 4px solid var(--laptop-light);
        border-left: 4px solid var(--laptop-mid);
        border-right: 4px solid var(--laptop-warm);
        border-top: 4px solid var(--laptop-dark);
    }
    .computer .logo-tiltshift {
        position: relative;
        width: 50px;
        height: 50px;
        background: var(--laptop-sticker-bg) url(/img/stickers/tiltshift-sticker.svg) center center no-repeat;
        background-blend-mode: darken;
        background-size: 50px;
        position: absolute;
        top: -5px;
        left: 30px;
        -webkit-transform: rotate(15deg);
    }
    .computer .logo-codefornl {
        position: relative;
        width: 100px;
        height: 22px;
        background: var(--laptop-sticker-bg) url(/img/stickers/codefornl-sticker.svg) center center no-repeat;
        background-blend-mode: darken;
        background-size: 100px;
        position: absolute;
        top: 20px;
        left: 102px;
        -webkit-transform: rotate(-5deg);
    }
    .computer .logo-publiccode {
        position: relative;
        width: 40px;
        height: 40px;
        background: var(--laptop-sticker-bg) url(/img/stickers/publiccode-sticker.png) center center no-repeat;
        background-blend-mode: darken;
        background-size: 40px;
        position: absolute;
        top: -8px;
        left: 260px;
        -webkit-transform: rotate(5deg);
    }
    .computer .logo-opensourcewerken {
        position: relative;
        width: 32px;
        height: 32px;
        background: var(--laptop-sticker-bg) url(/img/stickers/opensourcewerken-sticker.png) center center no-repeat;
        background-blend-mode: darken;
        background-size: 32px;
        position: absolute;
        top: 13px;
        left: 222px;
        -webkit-transform: rotate(-10deg);
    }
    .computer .logo-hacker-patch {
        position: relative;
        width: 40px;
        height: 40px;
        background: var(--laptop-sticker-bg) url(/img/stickers/hacker-patch-sticker.svg) center center no-repeat;
        background-blend-mode: darken;
        background-size: 42px;
        position: absolute;
        top: -8px;
        left: 73px;
        -webkit-transform: rotate(1deg);
    }
</style>
<div id="easterEgg" class="banner-image easter-egg" style="background-image: url({{ site.banner | relative_url }})">
    <div class="computer-blur"></div>
    <div class="computer">
        <canvas class="screen"></canvas>
        <div class="bottom">
            <div class="drive"></div>
            <a target="_blank" href="https://www.tiltshift.nl"><div class="logo-tiltshift" alt="Tiltshift logo sticker"></div></a>
            <a target="_blank" href="https://www.codefor.nl"><div class="logo-codefornl" alt="Code for NL logo sticker"></div></a>
            <a target="_blank" href="https://www.standardforpubliccode.org"><div class="logo-publiccode" alt="Standard for Public Code logo sticker"></div></a>
            <a target="_blank" href="https://www.opensourcewerken.nl"><div class="logo-opensourcewerken" alt="Opensourcewerken logo sticker"></div></a>
            <a target="_blank" href="https://en.wikipedia.org/wiki/Hacker_culture"><div class="logo-hacker-patch" alt="Hacker patch sticker"></div></a>
        </div>
    </div>
</div>
