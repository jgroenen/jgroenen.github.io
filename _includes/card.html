{% if include.card %}
<a name="{{ item.id }}"></a>
<div class="card" data-tags>
    <div class="card-inner">
        <div class="card-logo card-logo-cover">
            <img src="{{ item.image | default: site.data.person.picture }}" width="48" height="48" alt="" onerror="this.onerror = null; this.src = '{{ site.data.person.picture }}'">
        </div>
        <div class="card-body">
            <h2>{{ item.title }}</h2>

            <p class="card-subtitle">{% include date.html date=item.date %}</p>

            {% include tag-list.html tags=item.tags %}

            <p>{{ item.teaser }}</p>

            <p><a href="{{ item.url }}">Lees {{ item.label | default: item.title }}</a></p>
        </div>
    </div>
</div>
{% endif %}
