<header class="section">
    <a href="/" aria-label="Home">
        <img class="banner-image" src="https://img.apitecture.nl/?url={{ site.banner | url_encode }}" alt="#publictech banner">
        {% include computer.html %}
    </a>
    <img class="profile-image" src="https://img.apitecture.nl/?url={{ site.data.person.picture }}" alt="Profielfoto">
    <img class="klik" src="{{ "/img/klik.svg" | relative_url }}" alt="">
    <h1 class="header-name">{{ site.title }}</h1>
    <div class="section-body">
        <p>{{ site.description }}</p>
        <p><a class="button button-mastodon" rel="me" href="https://social.codefor.nl/@johan" aria-label="Mastodon">Mastodon</a></p>
    </div>
</header>
