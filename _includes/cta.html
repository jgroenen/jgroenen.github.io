<section class="section">
    {% if include.icon %}<img class="section-icon" src="{{ include.icon }}" alt="">{% endif %}
    <h1>{{ include.title }}</h1>
    <div class="section-body">
        <p>{{ include.teaser }}</p>
        <p><a class="button" href="{{ include.url }}">{{ include.cta }}</a></p>
    </div>
</section>
